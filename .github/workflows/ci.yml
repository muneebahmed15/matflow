name: CI

on:
  push:
    branches: [master, main, 'cursor/**']
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Only the credential-free smoke spec runs here. e2e/auth.spec.ts and
      # e2e/golden-path.spec.ts exercise real Supabase Admin API calls (creating
      # confirmed users) and will fail against these placeholder credentials.
      # To run the full suite in CI, add real (non-production) Supabase project
      # secrets - NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
      # SUPABASE_SERVICE_ROLE_KEY - as repository secrets and switch this step
      # to `npm run test:e2e`.
      - name: E2E smoke tests
        run: npm run test:e2e:smoke
